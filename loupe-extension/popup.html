<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html,
  body {
    width: 360px;
    margin: 0;
    overflow: hidden;
    background: #fff;
    color: #111113;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    letter-spacing: 0;
  }

  .shell {
    overflow: hidden;
    background:
      linear-gradient(#fff, #fff) padding-box,
      linear-gradient(135deg, rgba(168, 85, 247, 0.28), rgba(236, 72, 153, 0.28), rgba(249, 115, 22, 0.28)) border-box;
    border: 1px solid transparent;
  }

  .brand-strip {
    height: 4px;
    background: linear-gradient(90deg, #a855f7 0%, #ec4899 52%, #f97316 100%);
  }

  .header {
    padding: 16px 16px 12px;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    display: block;
    width: auto;
    height: 24px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #ececf0;
    border-radius: 999px;
    background: #f7f7f8;
    padding: 5px 9px;
    color: #71717a;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(135deg, #a855f7, #ec4899, #f97316);
  }

  .subtitle {
    margin-top: 10px;
    color: #5f6068;
    font-size: 12px;
    line-height: 1.4;
  }

  .current-page {
    margin: 0 16px 12px;
    border: 1px solid #efeff3;
    border-radius: 14px;
    background: #fbfbfc;
    padding: 10px 11px;
  }

  .current-label {
    color: #a1a1aa;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .current-url {
    margin-top: 4px;
    overflow: hidden;
    color: #28282e;
    font-size: 11px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .section {
    border-top: 1px solid #f1f1f4;
    padding: 13px 16px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 9px;
  }

  .section-label {
    color: #71717a;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .hint {
    color: #a1a1aa;
    font-size: 10px;
    white-space: nowrap;
  }

  input[type="text"] {
    width: 100%;
    border: 1px solid #e4e4e7;
    border-radius: 12px;
    outline: none;
    background: #fff;
    padding: 10px 12px;
    color: #111113;
    font: inherit;
    font-size: 12px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input[type="text"]:focus {
    border-color: #ec4899;
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.12);
  }

  input[type="text"]::placeholder { color: #c9c9d2; }

  .checks {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
  }

  .chip { position: relative; }
  .chip input[type="checkbox"] { position: absolute; opacity: 0; pointer-events: none; }

  .chip label {
    display: flex;
    min-height: 34px;
    align-items: center;
    gap: 8px;
    border: 1px solid #ececf0;
    border-radius: 11px;
    background: #fff;
    padding: 8px 10px;
    color: #555762;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    user-select: none;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }

  .chip input:checked + label {
    border-color: #f4c2da;
    background: #fff7fb;
    color: #19191f;
  }

  .chip-dot {
    width: 15px;
    height: 15px;
    border: 1px solid #d8d8de;
    border-radius: 999px;
    background: #fff;
    flex: none;
  }

  .chip input:checked + label .chip-dot {
    border-color: transparent;
    background:
      radial-gradient(circle at 50% 50%, #fff 0 2px, transparent 2.4px),
      linear-gradient(135deg, #a855f7, #ec4899, #f97316);
  }

  .actions {
    border-top: 1px solid #f1f1f4;
    padding: 13px 16px 14px;
  }

  .primary,
  .secondary {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 13px;
    border: 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0;
    transition: transform 0.15s, filter 0.15s, opacity 0.15s, border-color 0.15s, background 0.15s;
  }

  .primary {
    min-height: 46px;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 52%, #f97316 100%);
    color: #fff;
    box-shadow: 0 12px 24px rgba(236, 72, 153, 0.22);
  }

  .primary:hover:not(:disabled) {
    filter: saturate(1.07) brightness(0.99);
    transform: translateY(-1px);
  }

  .secondary {
    min-height: 40px;
    margin-top: 8px;
    border: 1px solid #ececf0;
    background: #fff;
    color: #28282e;
  }

  .secondary:hover:not(:disabled) {
    border-color: #d7d7de;
    background: #fafafa;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    transform: none;
  }

  .status {
    min-height: 15px;
    margin-top: 9px;
    text-align: center;
    color: #8b8d98;
    font-size: 11px;
    line-height: 1.35;
  }

  .status.error { color: #dc2626; }
  .status.ok { color: #16a34a; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 13px;
    height: 13px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    border-radius: 999px;
    animation: spin 0.65s linear infinite;
  }
</style>
</head>
<body>
<div class="shell">
  <div class="brand-strip"></div>

  <header class="header">
    <div class="header-row">
      <img class="logo" src="loupe.svg" alt="Loupe">
      <span class="badge"><span class="badge-dot"></span>Design QA</span>
    </div>
    <p class="subtitle">Capture real Chrome styles from this tab, compare them to a selected Figma frame, or run a quick responsive layout check.</p>
  </header>

  <div class="current-page">
    <div class="current-label">Current tab</div>
    <div class="current-url" id="currentUrl">Detecting active page…</div>
  </div>

  <section class="section">
    <div class="section-head">
      <div class="section-label">Figma frame</div>
      <div class="hint">Copy link to selection</div>
    </div>
    <input id="figmaUrl" type="text" placeholder="https://figma.com/design/…" />
  </section>

  <section class="section">
    <div class="section-head">
      <div class="section-label">Compare</div>
      <div class="hint">Choose checks</div>
    </div>
    <div class="checks">
      <div class="chip">
        <input type="checkbox" id="chk-missing" checked>
        <label for="chk-missing"><span class="chip-dot"></span>Missing comps</label>
      </div>
      <div class="chip">
        <input type="checkbox" id="chk-family" checked>
        <label for="chk-family"><span class="chip-dot"></span>Font family</label>
      </div>
      <div class="chip">
        <input type="checkbox" id="chk-size" checked>
        <label for="chk-size"><span class="chip-dot"></span>Font size</label>
      </div>
      <div class="chip">
        <input type="checkbox" id="chk-weight" checked>
        <label for="chk-weight"><span class="chip-dot"></span>Font weight</label>
      </div>
      <div class="chip">
        <input type="checkbox" id="chk-color" checked>
        <label for="chk-color"><span class="chip-dot"></span>Color</label>
      </div>
    </div>
  </section>

  <div class="actions">
    <button class="primary" id="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      Capture & compare
    </button>
    <button class="secondary" id="responsiveBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/>
      </svg>
      Responsive check
    </button>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
