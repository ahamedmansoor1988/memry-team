<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html,
  body {
    width: 100%;
    min-width: 320px;
    min-height: 100vh;
    overflow-x: hidden;
    background: #fff;
    color: #111113;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    letter-spacing: 0;
  }

  body { overflow-y: auto; }

  .shell {
    min-height: 100vh;
    padding-bottom: 88px;
    background: #fff;
  }

  .brand-strip {
    height: 4px;
    background: linear-gradient(90deg, #a855f7 0%, #ec4899 52%, #f97316 100%);
  }

  .header {
    padding: 18px 18px 14px;
  }

  .header-row,
  .section-head,
  .tool-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .logo {
    display: block;
    height: 26px;
    width: auto;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #ececf0;
    border-radius: 999px;
    background: #f7f7f8;
    padding: 5px 9px;
    color: #71717a;
    font-size: 10px;
    font-weight: 800;
    white-space: nowrap;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(135deg, #a855f7, #ec4899, #f97316);
  }

  .subtitle {
    margin-top: 10px;
    color: #5f6068;
    font-size: 13px;
    line-height: 1.45;
  }

  .current-page,
  .pat-warning {
    margin: 0 18px 12px;
    border: 1px solid #efeff3;
    border-radius: 14px;
    background: #fbfbfc;
    padding: 10px 11px;
  }

  .pat-warning {
    border-color: #fecaca;
    background: #fef2f2;
    color: #991b1b;
  }

  .pat-warning[hidden] { display: none; }

  .pat-warning strong {
    display: block;
    font-size: 11px;
    line-height: 1.35;
  }

  .pat-warning button {
    margin-top: 7px;
    border: 0;
    background: transparent;
    color: #991b1b;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .current-label,
  .section-label {
    color: #71717a;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .current-label { color: #a1a1aa; font-size: 9px; }

  .current-url {
    margin-top: 4px;
    overflow: hidden;
    color: #28282e;
    font-size: 11px;
    font-weight: 700;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .section {
    border-top: 1px solid #f1f1f4;
    padding: 14px 18px;
  }

  .section-head { margin-bottom: 9px; }

  .hint {
    color: #a1a1aa;
    font-size: 10px;
    white-space: nowrap;
  }

  input[type="text"] {
    width: 100%;
    border: 1px solid #e4e4e7;
    border-radius: 12px;
    outline: none;
    background: #fff;
    padding: 10px 12px;
    color: #111113;
    font: inherit;
    font-size: 12px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input[type="text"]:focus {
    border-color: #ec4899;
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.12);
  }

  input[type="text"]::placeholder { color: #c9c9d2; }

  .agent-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 7px;
  }

  .agent-button,
  .preset-button {
    display: flex;
    min-width: 0;
    align-items: center;
    border: 1px solid #ececf0;
    border-radius: 11px;
    background: #fff;
    color: #555762;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 800;
    transition: border-color 0.15s, background 0.15s, color 0.15s, transform 0.15s;
  }

  .preset-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
    margin-top: 8px;
  }

  .preset-button {
    min-height: 46px;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 8px;
    text-align: left;
  }

  .preset-button:hover,
  .agent-button:hover {
    border-color: #f4c2da;
    background: #fff7fb;
    color: #19191f;
    transform: translateY(-1px);
  }

  .preset-size {
    margin-top: 3px;
    color: #9a9ba5;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9px;
    font-weight: 700;
  }

  .agent-button {
    min-height: 38px;
    justify-content: space-between;
    padding: 9px 10px;
  }

  .agent-button span:last-child {
    color: #a1a1aa;
    font-size: 10px;
  }

  .actions {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 2;
    border-top: 1px solid #f1f1f4;
    padding: 14px 18px 16px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 -12px 24px rgba(17, 17, 19, 0.04);
    backdrop-filter: blur(12px);
  }

  .primary {
    display: flex;
    width: 100%;
    min-height: 46px;
    min-width: 0;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 0;
    border-radius: 13px;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 52%, #f97316 100%);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 12px 24px rgba(236, 72, 153, 0.22);
    transition: transform 0.15s, filter 0.15s, opacity 0.15s;
  }

  .primary:hover:not(:disabled) {
    filter: saturate(1.07) brightness(0.99);
    transform: translateY(-1px);
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    transform: none;
  }

  .status {
    min-height: 15px;
    margin-top: 9px;
    text-align: center;
    color: #8b8d98;
    font-size: 11px;
    line-height: 1.35;
  }

  .status.error { color: #dc2626; }
  .status.ok { color: #16a34a; }
</style>
</head>
<body>
<div class="shell">
  <div class="brand-strip"></div>

  <header class="header">
    <div class="header-row">
      <img class="logo" src="loupe.svg" alt="Loupe">
      <span class="badge"><span class="badge-dot"></span>Design QA</span>
    </div>
    <p class="subtitle">Capture this tab for Figma QA, or open a device preview for responsive checks.</p>
  </header>

  <div class="current-page">
    <div class="current-label">Current page URL</div>
    <div class="current-url" id="currentUrl">Detecting active page…</div>
  </div>

  <div class="pat-warning" id="patWarning" hidden>
    <strong>Figma PAT expired. Update it in Settings.</strong>
    <button id="patSettingsBtn" type="button">Open Settings</button>
  </div>

  <section class="section">
    <div class="section-head">
      <div class="section-label">Figma frame URL</div>
      <div class="hint">Copy link to selection</div>
    </div>
    <input id="figmaUrl" type="text" placeholder="https://figma.com/design/…" />
  </section>

  <section class="section">
    <div class="section-head">
      <div class="section-label">Device preview</div>
      <div class="hint">Opens in Loupe</div>
    </div>
    <div class="preset-row">
      <button class="preset-button" type="button" data-preview-device="iphone-15-pro">
        Mobile <span class="preset-size">393 x 852</span>
      </button>
      <button class="preset-button" type="button" data-preview-device="ipad-pro">
        Tablet <span class="preset-size">1024 x 1366</span>
      </button>
      <button class="preset-button" type="button" data-preview-device="macbook-pro">
        Desktop <span class="preset-size">1440 x 900</span>
      </button>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <div class="section-label">Other agents</div>
    </div>
    <div class="agent-grid">
      <button class="agent-button" type="button" data-agent="brand">
        <span>Brand Check</span><span>Colors & fonts</span>
      </button>
      <button class="agent-button" type="button" data-agent="accessibility">
        <span>Accessibility</span><span>WCAG scan</span>
      </button>
    </div>
  </section>

  <div class="actions">
    <button class="primary" id="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      Capture & compare
    </button>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
